# ============================================================================
# deploysvr 宿主 nginx vhost — aigc.guangai.ai（BL-PROD-MIGRATE-DEPLOYSVR）
# ============================================================================
# 直连模型：用户 → DNS → deploysvr 公网 80/443（本 vhost + Certbot TLS）→ 127.0.0.1:3000（app 容器）。
# 不走 dmitsvr/WireGuard。与既有 10.77.0.2:8080 origin 块（grandtianfu/invoce）监听地址不同，互不冲突（H4）。
#
# 安装（见 runbook）：
#   cp deploy/nginx/aigc.conf /etc/nginx/sites-available/aigc.conf
#   ln -sf /etc/nginx/sites-available/aigc.conf /etc/nginx/sites-enabled/aigc.conf
#   mkdir -p /var/cache/nginx/aigc && chown -R www-data:www-data /var/cache/nginx/aigc
#   mkdir -p /var/www/certbot
#   certbot certonly --webroot -w /var/www/certbot -d aigc.guangai.ai -d cdn.aigc.guangai.ai   # 或 DNS-01 预签发
#   nginx -t && systemctl reload nginx
# ----------------------------------------------------------------------------

upstream aigc_backend {
    server 127.0.0.1:3000;
    keepalive 32; # 复用到 app 容器的连接，减少 TCP 开销
}

# 需宿主创建：mkdir -p /var/cache/nginx/aigc && chown www-data:www-data /var/cache/nginx/aigc
proxy_cache_path /var/cache/nginx/aigc levels=1:2 keys_zone=aigc_cache:10m max_size=100m inactive=5m;

# --- HTTP: ACME challenge + 跳转 HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name aigc.guangai.ai cdn.aigc.guangai.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- aigc.guangai.ai — 控制台 + API Gateway + MCP ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aigc.guangai.ai;

    ssl_certificate     /etc/letsencrypt/live/aigc.guangai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aigc.guangai.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m;

    # gzip（JSON API 响应）
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_vary on;

    # /v1/models：非流式，nginx 级缓存 + gzip
    location = /v1/models {
        proxy_pass         http://aigc_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;

        proxy_cache        aigc_cache;
        proxy_cache_valid  200 60s;
        proxy_cache_key    "$request_uri";
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # SSE 流式：API 路径关闭缓冲（H3）
    location /v1/ {
        proxy_pass http://aigc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # MCP：Streamable HTTP / SSE，关闭缓冲，长读超时（H3）
    location /mcp {
        proxy_pass http://aigc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/webhooks/ {
        proxy_pass http://aigc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://aigc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- cdn.aigc.guangai.ai — 静态 / CDN ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.aigc.guangai.ai;

    ssl_certificate     /etc/letsencrypt/live/aigc.guangai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aigc.guangai.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://aigc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://aigc_backend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
