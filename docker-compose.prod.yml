name: aigc-gateway

# deploysvr 生产编排（容器化 GHCR-pull 模型；BL-PROD-MIGRATE-DEPLOYSVR）。
# 宿主 nginx 接管公网 80/443 + TLS（见 deploy/nginx/aigc.conf）；本编排不抢端口、不跑 nginx/certbot。
# app 仅映射 127.0.0.1:3000 loopback，由宿主 nginx 反代。
# 镜像由 CI 按 git sha 打 tag 推 GHCR；VPS 只 pull 不构建。回滚 = 换 IMAGE_TAG（app + migrate 同 tag）。
# 需要服务器上的 .env（不入仓，权限 600）：GH_REPO / IMAGE_TAG / POSTGRES_* / DATABASE_URL / 全部 app secrets。
#   参考 .env.production.example。区别于仓库根的 docker-compose.production.yml（自带 nginx/certbot，已弃用）。

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # 仅 loopback；便于迁移期 pg_restore / 排障
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379" # 仅 loopback
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 一次性迁移（先迁移后起 app）。migrate 镜像含全量 node_modules + prisma CLI + migrations。
  # 幂等：DB 已是最新（含还原的生产快照）时为 no-op。
  migrate:
    image: ghcr.io/${GH_REPO}/migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ghcr.io/${GH_REPO}/app:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file: .env
    volumes:
      # GCS 服务账号 key（H2 跨云凭据）。宿主 /opt/apps/aigc-gateway/secrets/gcs-sa.json（600）。
      # 容器内路径需与 .env 的 GOOGLE_APPLICATION_CREDENTIALS 一致。
      - ./secrets/gcs-sa.json:/app/secrets/gcs-sa.json:ro
    ports:
      - "127.0.0.1:3000:3000" # 仅 loopback；宿主 nginx 反代
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # node:22 内置 fetch；/v1/models 无需鉴权（与旧机 deploy 健康检查一致）。避免依赖镜像内 curl。
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
  redisdata:
