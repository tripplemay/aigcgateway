name: Build & Push images

# BL-PROD-MIGRATE-DEPLOYSVR F-MIG-02：main push 自动构建 app + migrate 两镜像推 GHCR，
# 保证可部署镜像随时就绪。实际部署为手动（见 deploy.yml，遵循本项目"用户手动触发部署"策略）。

on:
  push:
    branches: [main]
    paths-ignore:
      - ".auto-memory/**"
      - "progress.json"
      - "features.json"
      - "backlog.json"
      - "docs/**"
      - "design-draft/**"
      - "**/*.md"
      - "harness-rules.md"
      - "planner.md"
      - "generator.md"
      - "evaluator.md"
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push app + migrate images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # app 镜像（standalone runner）。同域名部署，无 NEXT_PUBLIC_* 构建期注入。
      - name: Build & push app image (target runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/app:latest
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/app:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # migrate 镜像（FROM base，含 prisma CLI + migrations），供 compose migrate 服务跑 prisma migrate deploy。
      - name: Build & push migrate image (target migrate)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/migrate:latest
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/migrate:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
